<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Urbano - Contáctenos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="inicio.html">Flow Urbano</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="inicio.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="mi_musica.html">Mi Música</a></li>
          <li class="nav-item"><a class="nav-link active" href="contactenos.html">Contáctenos</a></li>
        </ul>
      </div>
    </div>
  </nav>


  <section class="container py-5">
    <div class="row g-4">
      <div class="col-lg-6">
        <h1 class="fw-bold mb-3">Contáctenos</h1>
        <p class="text-secondary">Para colaboraciones, prensa o cualquier consulta, puede escribirnos a través del siguiente formulario.</p>
        <form id="contactForm">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input class="form-control bg-dark text-white border-secondary" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input id="email" type="email" class="form-control bg-dark text-white border-secondary" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea rows="5" class="form-control bg-dark text-white border-secondary" required></textarea>
          </div>
          <button class="btn btn-primary rounded-3">Enviar</button>
        </form>
      </div>
      <div class="col-lg-6">
        <h5>Ubicación</h5>
        <div class="ratio ratio-16x9 mt-2 rounded overflow-hidden">
          <iframe src="https://www.google.com/maps?q=Bogota,Colombia&output=embed"></iframe>
        </div>
      </div>
    </div>
  </section>

  <footer class="bg-black text-center py-3 mt-5 border-top border-secondary">
    <small class="text-secondary">© 2025 Flow Urbano</small>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const form = document.getElementById("contactForm");
  form.addEventListener("submit", function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const now = Date.now();
    const cooldown = 60000; // 1 minuto en milisegundos

    const lastEmail = localStorage.getItem("lastEmail");
    const lastTime = localStorage.getItem("lastTime");

    if (lastEmail === email && lastTime && now - parseInt(lastTime) < cooldown) {
      alert("Ya enviaste un mensaje con este correo recientemente. Intenta de nuevo más tarde.");
      return;
    }

    // Guardar datos en localStorage
    localStorage.setItem("lastEmail", email);
    localStorage.setItem("lastTime", now);

    alert("Mensaje enviado correctamente.");
    form.reset();
  });
</script>
</body>
</html>
